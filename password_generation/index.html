<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style/style.css">
    <link rel="stylesheet" href="./style/reset.css">
    <title>Password Generation</title>
</head>

<body>
    <div class="wrapper">
        <h1>Password Generator</h1>

        <div class="generated_password">
            <input type="text" id="password" value="" placeholder="P4$5W0rD!"  readonly>
            <button id="copy"><p></p><svg width="21" height="24" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M20.341 3.091 17.909.659A2.25 2.25 0 0 0 16.319 0H8.25A2.25 2.25 0 0 0 6 2.25V4.5H2.25A2.25 2.25 0 0 0 0 6.75v15A2.25 2.25 0 0 0 2.25 24h10.5A2.25 2.25 0 0 0 15 21.75V19.5h3.75A2.25 2.25 0 0 0 21 17.25V4.682a2.25 2.25 0 0 0-.659-1.591ZM12.469 21.75H2.53a.281.281 0 0 1-.281-.281V7.03a.281.281 0 0 1 .281-.281H6v10.5a2.25 2.25 0 0 0 2.25 2.25h4.5v1.969a.282.282 0 0 1-.281.281Zm6-4.5H8.53a.281.281 0 0 1-.281-.281V2.53a.281.281 0 0 1 .281-.281H13.5v4.125c0 .621.504 1.125 1.125 1.125h4.125v9.469a.282.282 0 0 1-.281.281Zm.281-12h-3v-3h.451c.075 0 .147.03.2.082L18.667 4.6a.283.283 0 0 1 .082.199v.451Z"
                        fill="currentColor" />
                </svg></button>
        </div>
        <section class="options">
            <div>
                <div class="all_length_text">
                    <p>Characters length</p>
                    <span id="lengthText">10</span>
                </div>
                <input type="range" name="length" id="length" min="0" max="20" value="10" step="1">
            </div>

            <div class="field">
                <input type="checkbox" name="uppercase" id="uppercase" checked="true">
                <label for="uppercase">Include Uppercase Letters</label>
            </div>
            <div class="field">
                <input type="checkbox" name="lowercase" id="lowercase" checked="true">
                <label for="lowercase">Include Lowercase Letters</label>
            </div>
            <div class="field">
                <input type="checkbox" name="numbers" id="numbers" checked="true">
                <label for="numbers">Include Numbers</label>
            </div>
            <div class="field">
                <input type="checkbox" name="symbols" id="symbols" checked="true">
                <label for="symbols">Include Symbols</label>
            </div>
            <div class="strength">
                <p>STRENGTH</p>
                <div class="strength-info">
                    <span class="strength-label">MEDIUM</span>
                    <div class="strength-bar" id="strengthBar"></div>
                </div>
            </div>
            <button class="generate">GENERATE <svg width="12" height="12" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="m5.106 12 6-6-6-6-1.265 1.265 3.841 3.84H.001v1.79h7.681l-3.841 3.84z"/></svg></button>

        </section>
    </div>
    <script src="./app.js"></script>
</body>

</html>
